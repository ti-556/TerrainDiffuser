# ---- data -------------------------------------------------------
val_size      : 8               # first N samples go to validation

# ---- VGG  -------------------------------------------------------
feature_channels :              # resolution → channels kept
  16: 16
vgg_mode  : random              # all | topk | bottomk | random
vgg_seed  : 908                 # fixed “random” subset

# ---- UNet -------------------------------------------------------
unet:
  img_resolution : 32
  in_channels    : 3
  out_channels   : 3
  model_channels : 128
  channel_mult   : [2, 2, 2]
  channel_mult_emb : 4
  num_blocks     : 4
  attn_resolutions : [16]
  ngroups        : 16         
  dropout        : 0.10

# ---- text encoder ----------------------------------------------
text_model : google/flan-t5-small

# ---- training ---------------------------------------------------
batch        : 32
epochs       : 25
lr           : 5.0e-4
ema_decay    : 0.997
cfg_drop_prob: 0.1
precision : fp16      # fp32 | fp16 | bf16

num_workers     : 8   
prefetch_factor : 4  # num workers gotta be > 0

# ---- algorithm knobs -------------------------------------------
sampler   : sd3
weighting : sd3
loss      : flow

# ---- logging / ckpt --------------------------------------------
wandb_proj : TerrainGen
wandb_run  : experiment_v0
out_dir    : saves
val_every  : 1
save_every : 10
